services:
  arkivi-app:
    build:
      context: ./arkivi-app
      dockerfile: Dockerfile
    container_name: arkivi-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - DATABASE_URI=${DATABASE_URI:-file:./data/arkivi.db}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@arkivi.local}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Administrator Teknik}
    volumes:
      # Persistenca e plotë e bazës së të dhënave, fotove dhe kopjeve rezervë
      - ./arkivi-app/data:/app/data
      - ./arkivi-app/public/uploads:/app/public/uploads
      - ./arkivi-app/backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/cms"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      - arkivi-app
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
