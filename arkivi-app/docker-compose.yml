services:
  arkivi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkivi-dritan-berisha
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - DATABASE_URI=${DATABASE_URI:-file:./data/arkivi.db}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@arkivi.local}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-Arkivi2026!}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Administrator Teknik}
    volumes:
      # Persistenca e plotë e bazës së të dhënave, fotove dhe kopjeve rezervë
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/site"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
